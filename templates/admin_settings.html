{% extends "layout.html" %}
{% block title %}Configurações{% endblock %}
{% block content %}<main class="admin-page"><header class="admin-page-head"><a href="{{ url_for('admin_dashboard') }}">← Painel</a><h1>Configurações da loja</h1></header><section class="admin-panel settings-panel"><form method="post" class="settings-form"><label>Nome da loja<input name="store_name" required maxlength="60" value="{{ values.get('store_name','Pod Rush') }}"></label><label>Descrição curta<input name="store_tagline" maxlength="100" value="{{ values.get('store_tagline','Catálogo oficial') }}"></label><label>WhatsApp com código do país<input name="whatsapp" inputmode="numeric" placeholder="5511999999999" value="{{ values.get('whatsapp','') }}"><small>Inclua 55 + DDD + número, apenas números.</small></label><label>Mensagem do pedido no WhatsApp<textarea name="order_message" rows="4" maxlength="500" placeholder="Olá! Quero pedir {produto}{opcao} por {preco}.">{{ values.get('order_message','Olá! Quero pedir {produto}{opcao} por {preco}.') }}</textarea><small>Use {produto}, {opcao} e {preco} onde quiser inserir essas informações. Exemplo de opção: " — opção: Azul". Limite de 500 caracteres.</small></label><label class="toggle-row"><input type="checkbox" name="store_open" {% if values.get('store_open','1')=='1' %}checked{% endif %}><span>Loja aberta para pedidos</span></label><button class="admin-primary">Salvar configurações</button></form></section></main>{% endblock %}
