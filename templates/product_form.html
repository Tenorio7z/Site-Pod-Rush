{% extends "layout.html" %}
{% block title %}{{ 'Editar produto' if product else 'Novo produto' }}{% endblock %}
{% block content %}<main class="admin-page"><header class="admin-page-head"><a href="{{ url_for('admin_dashboard') }}">← Painel</a><h1>{{ 'Editar produto' if product else 'Cadastrar produto' }}</h1></header><section class="admin-panel settings-panel"><form class="settings-form" method="post" enctype="multipart/form-data"><label>Nome do produto<input name="name" required maxlength="120" value="{{ product.name if product else '' }}"></label><div class="settings-grid"><label>Preço<input type="number" name="price" required min="0.01" step="0.01" value="{{ '%.2f'|format(product.price/100) if product else '' }}"></label><label>Estoque<input type="number" name="stock" min="0" value="{{ product.stock if product else 0 }}"></label><label>Categoria<input name="category" maxlength="60" value="{{ product.category if product else '' }}"></label><label>Etiqueta opcional<input name="badge" maxlength="32" placeholder="Popular, Novo..." value="{{ product.badge if product else '' }}"></label></div><label>Descrição<textarea name="description" rows="3" maxlength="700">{{ product.description if product else '' }}</textarea></label><label>Imagem do produto<input type="file" name="image_file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG ou WEBP. Até 4 MB.{% if product and product.image.startswith('uploads/') %} Imagem atual: {{ product.image.split('/')[-1] }}{% endif %}</small>{% if product %}<img class="upload-preview" src="{{ product.image|product_image }}" alt="Imagem atual do produto">{% endif %}</label><label>Opções / variações<textarea name="flavors" rows="4" placeholder="Uma opção por linha">{{ product.flavors if product else '' }}</textarea><small>Ex.: tamanho P, tamanho M, roxo, azul.</small></label><label class="toggle-row"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}><span>Destacar no catálogo</span></label><label class="toggle-row"><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}><span>Produto visível no catálogo</span></label><button class="admin-primary">{{ 'Salvar alterações' if product else 'Cadastrar produto' }}</button></form></section></main>{% endblock %}
